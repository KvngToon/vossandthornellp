services:
  - type: web
    name: vossandthornellp
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn vossandthornellp.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DJANGO_SETTINGS_MODULE
        value: vossandthornellp.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,vossandthornellp.org
      # Investor documents: private Supabase Storage bucket (S3-compatible API).
      # Set the values in the Render dashboard; they are secrets, never commit them.
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Withdrawals: see investors/geo.py and investors/crypto.py. Both are secrets.
      - key: CF_ORIGIN_SECRET
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
