{# Expects: chart (labels/actual/projected), chart_id, currency #}
{{ chart|json_script:chart_id }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('{{ chart_id }}').textContent);
  var css = getComputedStyle(document.documentElement);
  function token(name) { return css.getPropertyValue(name).trim(); }
  var oxford = token('--oxford'), brass = token('--brass'), slate = token('--slate'),
      fog = token('--fog'), fog2 = token('--fog-2'), ink = token('--ink'), sans = token('--sans');
  var cur = '{{ currency|escapejs }}';
  function fmt(v) { return new Intl.NumberFormat('en-US', {style: 'currency', currency: cur, maximumFractionDigits: 0}).format(v); }
  function lab(iso) { var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', {month: 'short', year: 'numeric'}); }
  function tint(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  Chart.defaults.font.family = sans; Chart.defaults.font.size = 12; Chart.defaults.color = slate;
  // a little air between the legend and the top of the plot
  var legendSpacer = {id: 'legendSpacer', beforeInit: function (chart) {
    var fit = chart.legend.fit; chart.legend.fit = function () { fit.bind(chart.legend)(); this.height += 14; };
  }};
  new Chart(document.getElementById('{{ chart_id }}-canvas'), {
    type: 'line', plugins: [legendSpacer],
    data: {
      labels: data.labels,
      datasets: [
        {label: 'Value to date', data: data.actual, borderColor: oxford, backgroundColor: tint(oxford, .06), fill: true, tension: .22, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: oxford, borderWidth: 2.5, spanGaps: false},
        {label: 'Projected', data: data.projected, borderColor: brass, borderDash: [7, 5], fill: false, tension: .22, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: brass, borderWidth: 2, spanGaps: false}
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      animation: calm ? false : {duration: 900, easing: 'easeOutQuart'},
      plugins: {
        legend: {align: 'start', labels: {color: slate, usePointStyle: true, pointStyle: 'line', boxWidth: 26, padding: 18}},
        tooltip: {backgroundColor: '#ffffff', titleColor: oxford, bodyColor: ink, borderColor: fog2, borderWidth: 1, padding: 12, cornerRadius: 2,
                  boxPadding: 4, titleFont: {weight: '600'},
                  callbacks: {title: function (items) { return lab(data.labels[items[0].dataIndex]); },
                              label: function (c) { return c.parsed.y == null ? null : c.dataset.label + ': ' + fmt(c.parsed.y); }}}
      },
      scales: {
        x: {grid: {display: false}, border: {color: fog2}, ticks: {color: slate, maxTicksLimit: window.innerWidth < 600 ? 4 : 8, maxRotation: 0, callback: function (v) { return lab(data.labels[v]); }}},
        y: {grid: {color: fog}, border: {display: false}, ticks: {color: slate, callback: fmt, padding: 8}}
      }
    }
  });
})();
</script>
